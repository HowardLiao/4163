<style>
:root{--g:#1F3A2E;--iv:#F8F3E9;--br:#A3864C;--ink:#1F1F1C;--mu:#66655E;--rd:#8C2F2B}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--g);color:var(--iv);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left))}

input[type=password]:focus{border-color:var(--g)}

button{width:100%;font-size:15px;padding:11px;border:0;background:var(--g);color:var(--iv);cursor:pointer}
button:disabled{opacity:.6}

var te=new TextDecoder();
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function ub64(u){var s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function dec(key,u){return crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(0,12)},key,u.slice(12))}

function store(raw,rem){try{var v=ub64(new Uint8Array(raw));if(rem)localStorage.setItem(SK,v);else sessionStorage.setItem(SK,v)}catch(e){}}
function clearStored(){try{localStorage.removeItem(SK);sessionStorage.removeItem(SK)}catch(e){}}

function open(key){
  return dec(key,b64(DATA)).then(function(buf){
    var P=JSON.parse(te.decode(buf)),M=P.m,cache={};
    function blobUrl(path){
      if(cache[path])return cache[path];
      var ent=M[path];if(!ent)return Promise.reject("no "+path);
      cache[path]=fetch(ROOT+"x/"+ent[0]).then(function(r){if(!r.ok)throw r.status;return r.arrayBuffer()}).then(function(ab){return dec(key,new Uint8Array(ab))}).then(function(pt){return URL.createObjectURL(new Blob([pt],{type:ent[1]}))});
      return cache[path];
    }
    var html=P.html,urls=[],re=/url\(enc:([^)]+)\)/g,m;
    while((m=re.exec(html)))if(urls.indexOf(m[1])<0)urls.push(m[1]);

// runs inside the decrypted document
function runtime(blobUrl){
